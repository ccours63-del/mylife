<style>
:root{color-scheme:dark;
--bg:#0B0D10;--surface:#14181E;--soft:#1D222B;--line:#262C36;--ink:#ECEFF4;--muted:#8B94A5;
--accent:#F5B544;--accent-ink:#1B1304;--good:#4FC48B;--bad:#F2726C;--warn:#E9A83B;}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:0 14px 100px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px}
bdi{unicode-bidi:isolate}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:20px 2px 6px}
h1{font-size:30px;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;margin-top:8px}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-weight:600;color:var(--muted)}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 2px}
.nav button{width:40px;height:40px;border-radius:12px;font-size:24px;background:var(--surface);border:1px solid var(--line)}
.nav-l{font-weight:700;text-align:center}
.link{color:var(--accent);font-size:13px;font-weight:600;display:block;margin:4px auto 0;padding:4px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:start;display:block;width:100%}
.stat b{font-size:24px;display:block;line-height:1.3;font-weight:800}
.stat span{color:var(--muted);font-size:12.5px}
.stat .t{color:var(--ink);font-size:13.5px;font-weight:700;display:block;margin-bottom:2px}
.grid3 .stat{padding:10px}
.grid3 .stat b{font-size:22px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.h2{font-size:16px;font-weight:800;margin:18px 2px 6px}
.muted{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.row{display:flex;gap:8px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.danger{color:var(--bad);font-size:13px;font-weight:600;padding:8px 2px}
.x{color:var(--muted);font-size:20px;padding:0 6px}
/* prayers */
.prow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
.pname{font-size:17px;font-weight:700}
.pbtns{display:flex;gap:6px}
.pb{padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;color:var(--muted)}
.pb.on1{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.pb.on2{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.wgrid{display:grid;grid-template-columns:52px repeat(7,1fr);gap:6px;align-items:center}
.wh{font-size:10.5px;text-align:center;color:var(--muted);line-height:1.3}
.wh small{display:block;font-size:13px;color:var(--ink);font-weight:700}
.wn{font-weight:700;font-size:13px}
.dot{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);width:100%;max-width:36px;justify-self:center}
.dot.s1{background:var(--soft);border-color:var(--accent)}
.dot.s2{background:var(--accent);border-color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.ch{font-size:10.5px;color:var(--muted);text-align:center}
.cc{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;line-height:1.15;background:var(--surface)}
.cc small{font-size:10px;font-weight:500;min-height:12px}
.cc.today{outline:2px solid var(--ink);outline-offset:1px}
.cc.hi{color:var(--accent-ink)}
.cc.cc-c{background:var(--good);color:#fff;border-color:var(--good)}
.cc.cc-r{background:var(--bad);color:#fff;border-color:var(--bad)}
.cc:disabled{opacity:.35}
.yrow{display:grid;grid-template-columns:76px 1fr 44px;gap:10px;align-items:center;width:100%;padding:9px 0;text-align:start}
.yrow b{text-align:end;font-size:13px}
.big{font-size:34px;font-weight:800;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.hb{padding:18px 0;border-radius:14px;border:2px solid var(--line);font-size:17px;font-weight:800;color:var(--muted)}
.hb.good.on{background:var(--good);border-color:var(--good);color:#fff}
.hb.bad.on{background:var(--bad);border-color:var(--bad);color:#fff}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.q{font-weight:700}
.stack{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%}
/* money */
.acc{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.tx small{color:var(--muted);display:block;font-size:12px}
.amt{font-weight:800;white-space:nowrap}
.cat{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
/* projects & uni */
.phead{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;margin-bottom:8px}
.phead small{display:block;color:var(--muted);font-size:12.5px}
.pct{font-size:20px;font-weight:800}
.tasks{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.task{display:flex;align-items:center;gap:10px;padding:7px 0}
.task span{flex:1}
.task .done{text-decoration:line-through;color:var(--muted)}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;color:var(--accent-ink);font-size:15px;line-height:1}
.chk.on{background:var(--accent);border-color:var(--accent)}
.crs{display:grid;grid-template-columns:1fr 54px 76px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.crs input{padding:6px 8px;text-align:center}
.tag{font-size:11.5px;padding:1px 8px;border-radius:8px;background:var(--soft);color:var(--muted);font-weight:600;margin-inline-start:6px}
.tag.late{background:var(--bad);color:#fff}
/* nav + modal */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.bnav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.bnav button{padding:13px 0 11px;font-size:11px;font-weight:600;color:var(--muted);border-top:3px solid transparent}
.bnav button.on{color:var(--accent);border-top-color:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{font-size:18px;margin-bottom:12px}
.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.typ{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typ label{text-align:center;padding:10px;border:2px solid var(--line);border-radius:12px;font-weight:700;color:var(--muted)}
.typ input{position:absolute;opacity:0;width:0}
.typ input:checked+span{color:var(--ink)}
.typ label:has(input:checked){border-color:var(--accent);background:var(--soft);color:var(--ink)}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:6px}
.acts{display:flex;gap:8px;margin-top:14px}.acts .btn{flex:1}
.warnbox{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:10px}
@media (prefers-reduced-motion:no-preference){.bar i,.stack i{transition:width .3s}}

/* notes */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap;color:var(--muted);flex:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:4px;min-height:112px}
.nc b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc .np{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.nc small{color:var(--muted);font-size:11.5px}
.ed{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto}
.ed-in{max-width:560px;margin:0 auto;padding:0 16px 45vh}
.ed-head{position:sticky;top:0;background:var(--bg);z-index:2;padding-top:max(8px,env(safe-area-inset-top))}
.ed-top{display:flex;align-items:center;justify-content:space-between}
.ed-top button{padding:10px 4px;font-weight:700}
.ed-tools{display:flex;gap:6px;overflow-x:auto;padding:8px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.ed-tools button{flex:none;min-width:42px;padding:7px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.ed-body{position:relative}
.ed-title{font-size:28px;font-weight:800;border:0;background:none;padding:14px 0 6px;border-radius:0}
.ed-title:focus{outline:none}
.blk{display:flex;align-items:flex-start;gap:10px;padding:4px 0}
.blk .bt{flex:1;min-width:0;min-height:1.7em;outline:none;word-break:break-word;font-size:17px;line-height:1.7}
.blk[data-type=h1] .bt{font-size:25px;font-weight:800}
.blk[data-type=h2] .bt{font-size:20px;font-weight:700}
.blk .bt:empty:focus::before{content:attr(data-ph);color:var(--muted)}
.blk hr{flex:1;border:0;border-top:1.5px solid var(--line);margin:14px 0}
.cbx{width:26px;height:26px;border-radius:50%;border:2px solid #5A6378;flex:none;margin-top:4px;position:relative;transition:background-color .22s,border-color .22s}
.cbx::after{content:"";position:absolute;inset:0;margin:auto;width:7px;height:12px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg) scale(0);transition:transform .28s cubic-bezier(.3,1.7,.5,1)}
.blk[data-done="1"] .cbx{background:var(--accent);border-color:var(--accent)}
.blk[data-done="1"] .cbx::after{transform:translateY(-1px) rotate(45deg) scale(1)}
.blk[data-done="1"] .bt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.blk .bt{transition:color .25s}
.bt mark{background:color-mix(in srgb,var(--warn) 38%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.slash{position:absolute;inset-inline-start:0;width:min(260px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:3}
.slash[hidden]{display:none}
.slash button{display:block;width:100%;text-align:start;padding:10px 12px;border-radius:10px;font-weight:600}
.slash button:active{background:var(--soft)}
/* social */
.sp-card{margin:10px 0}
.sp-card .line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chg{font-weight:800;font-size:13.5px;white-space:nowrap}
.chart{width:100%;height:auto;direction:ltr;display:block}
.logrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}

/* ===== v3: dark notes-style home, icons, motion ===== */
button{transition:transform .12s ease,background-color .2s,color .2s,border-color .2s,opacity .2s}
button:active:not(:disabled){transform:scale(.95)}
.topbar{position:sticky;top:0;z-index:6;background:rgba(11,13,16,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tb-in{max-width:520px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:19px;color:var(--accent)}

.day{position:relative}

.day-title:focus{outline:none}
.datebar{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin:0 0 12px}

.datebar .tday{width:auto;padding:0 12px;font-size:13px;font-weight:700;color:var(--accent)}
.prog{margin:2px 0 16px}

.addrow{display:flex;align-items:center;gap:10px;color:var(--muted);padding:12px 2px;font-weight:600;width:100%;text-align:start}

.addrow:active{color:var(--accent)}
.blk[data-type=check] .bt:empty::before{content:attr(data-ph);color:var(--muted);opacity:.55}
.day .ed-tools{position:fixed;top:0;left:0;right:0;z-index:7;background:var(--bg);border:0;padding:max(10px,env(safe-area-inset-top)) 16px 8px;transform:translateY(-115%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.day:focus-within .ed-tools{transform:none}
.ed-tools-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:520px;margin:0 auto;flex:1;min-width:0}
.ed-head .ed-tools-in{padding:0}
/* dock */
.dock{position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(16,19,24,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
body.kb .dock{transform:translateY(110%)}
.dk-in{position:relative;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px}
.dk-ind{position:absolute;top:6px;bottom:6px;inset-inline-start:calc(var(--i,0)*100%/5);width:calc(100%/5);padding:0 3px;transition:inset-inline-start .38s cubic-bezier(.3,1.25,.4,1);pointer-events:none}
.dk-ind::before{content:"";display:block;height:100%;border-radius:14px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.dk-b{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;color:var(--muted);font-size:10.5px;font-weight:600;min-width:0}
.dk-b span{white-space:nowrap;transition:color .25s}
.dk-b svg{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.dk-b.on{color:var(--accent)}
.dk-b.on svg{transform:translateY(-1px) scale(1.12);animation:navPop .42s}
/* motion */
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page.enter{animation:pageIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
html[dir=rtl] .page.enter .bar i{transform-origin:right;animation:grow .7s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(1)}38%{transform:scale(.84)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.pop{animation:pop .38s}
@keyframes navPop{0%{transform:translateY(3px) scale(.8)}60%{transform:translateY(-4px) scale(1.2)}100%{transform:translateY(-1px) scale(1.12)}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes edIn{from{opacity:0;transform:translateY(24px)}}
@keyframes blkIn{from{opacity:0;transform:translateY(-4px)}}
.ov{animation:fadeIn .2s}
.sheet{animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
.ed{animation:edIn .3s cubic-bezier(.2,.8,.2,1)}
.blk{animation:blkIn .22s ease-out}
.nc,.stat{transition:transform .15s,border-color .2s}
.nc:active,.stat:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.day .ed-tail{min-height:60vh}

.slash{width:min(290px,100%);overflow:auto;overscroll-behavior:contain}

.scs{display:grid;gap:10px}
.sc{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:start;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--st);animation:stIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms);transition:transform .15s}
.sc:active,.ex:active{transform:scale(.97)}
.sc.td{border-inline-start-color:var(--td)}.sc.tp{border-inline-start-color:var(--tp)}
.sc b{font-size:16px}
.stime{font-size:12px;color:var(--muted);font-weight:700;direction:ltr;min-width:74px;text-align:center}
.sc em{font-style:normal;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--st) 18%,transparent);color:var(--st)}
.sc.td em{background:color-mix(in srgb,var(--td) 18%,transparent);color:var(--td)}
.sc.tp em{background:color-mix(in srgb,var(--tp) 18%,transparent);color:var(--tp)}
.wk-scroll{overflow-x:auto;margin-top:8px}
.wg{border-collapse:separate;border-spacing:4px;min-width:540px;width:100%;font-size:11.5px}
.wg th{color:var(--muted);font-weight:700;padding:4px;white-space:nowrap;direction:ltr}
.wc{width:100%;min-height:42px;padding:4px;border-radius:10px;background:var(--soft);color:var(--muted);font-weight:700;font-size:11.5px;line-height:1.25}
.wc.cr{background:color-mix(in srgb,var(--st) 20%,var(--surface));color:var(--st)}
.wc.td{background:color-mix(in srgb,var(--td) 20%,var(--surface));color:var(--td)}
.wc.tp{background:color-mix(in srgb,var(--tp) 20%,var(--surface));color:var(--tp)}
.cd{text-align:center;padding:20px 14px;border-radius:24px;margin:12px 0;background:linear-gradient(145deg,color-mix(in srgb,var(--st) 22%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--st) 45%,var(--line));animation:flt 4s ease-in-out infinite,glw 2.8s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-6px)}}
@keyframes glw{0%,100%{box-shadow:0 0 0 transparent}50%{box-shadow:0 10px 36px color-mix(in srgb,var(--st) 35%,transparent)}}
.cd h3{font-size:22px;margin:4px 0 12px}.cd small{color:var(--muted);font-size:12.5px}
.cdb{display:flex;direction:ltr;gap:8px;justify-content:center;margin-bottom:12px}
.cdb div{flex:1;max-width:78px;padding:10px 0;border-radius:16px;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line)}
.cdb b{display:block;font-size:26px;font-variant-numeric:tabular-nums;color:var(--st)}
.cdb span{font-size:11px;color:var(--muted)}
.tk{animation:tk .35s}
@keyframes tk{from{opacity:.2;transform:translateY(-8px) scale(.9)}}
.exl{display:grid;gap:8px}
.ex{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:start;padding:13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);animation:stIn .5s both;animation-delay:calc(var(--i)*60ms);transition:transform .15s}
.ex small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ex em{font-style:normal;font-weight:800;font-size:12px;padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--st) 18%,transparent);color:var(--st);white-space:nowrap}
.ex.past{opacity:.5}
.addb{width:100%;margin-top:12px;padding:13px}
.abh{display:flex;justify-content:space-between;align-items:center}
.abh b{font-size:28px;display:block}
.ab{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px;animation:stIn .5s both;animation-delay:calc(var(--i)*60ms)}
.ab.warn{border-color:var(--warn)}
.ab.bad{border-color:var(--bad);box-shadow:0 0 18px color-mix(in srgb,var(--bad) 22%,transparent)}
.abt{display:flex;justify-content:space-between;align-items:center}
.abs{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}
.ab.good .abs{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.ab.warn .abs{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.ab.bad .abs{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.abm{display:flex;align-items:center;justify-content:center;gap:22px;margin:10px 0}
.abm button{width:44px;height:44px;border-radius:50%;background:var(--soft);font-size:22px;font-weight:700;transition:transform .12s}
.abm button:active{transform:scale(.88)}.abm button:disabled{opacity:.3}
.abn b{font-size:32px}.abn small{color:var(--muted)}
.abb{height:6px;border-radius:9px;background:var(--soft);overflow:hidden}
.abb i{display:block;height:100%;border-radius:9px;margin-inline-start:0;transform-origin:right;animation:grow .8s cubic-bezier(.2,.8,.2,1)}
.ab.good i{background:var(--good)}.ab.warn i{background:var(--warn)}.ab.bad i{background:var(--bad)}
@media (prefers-reduced-motion:reduce){.cd,.sc,.ex,.ab,.abb i{animation:none!important}}

/* ===== prayer times card ===== */
.pt{--pt:#33AEE0;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);margin:8px 0}
.pt-row{display:grid;grid-template-columns:repeat(5,1fr)}
.pt-c{text-align:center;padding:7px 0 6px;color:var(--muted);line-height:1.35;border-bottom:2px solid transparent}
.pt-c b{display:block;font-size:12px;font-weight:600}
.pt-c span{display:block;font-size:15px;font-weight:700;direction:ltr;color:var(--ink)}
.pt-c.cur{border-bottom-color:var(--muted)}
.pt-c.nx{background:var(--pt);color:#fff;border-bottom-color:var(--pt)}
.pt-c.nx span{color:#fff}
.pt-bar{display:flex;justify-content:space-between;align-items:center;padding:3px 10px 3px 4px;font-size:12px;color:var(--muted);background:var(--soft)}
.pt-bar bdi{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.pt-gear{width:26px;height:26px;border-radius:8px;color:var(--muted);font-size:14px}
.ptg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pto{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pto label{font-size:11.5px;color:var(--muted);text-align:center;display:block}
.pto input{text-align:center;padding:8px 2px}
/* ===== eyes ===== */
.eyes{--st:#4fc3f7;--dd:#4fc3f7;--dp:#b58cff;--dc:#F5B544}
.eyes .seg .on{background:color-mix(in srgb,var(--st) 20%,var(--surface));color:var(--st)}
.ets{display:grid;gap:10px;margin:10px 0}
.et{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:start;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);transition:transform .15s,background .3s,border-color .3s;animation:stIn .5s both;animation-delay:calc(var(--i)*80ms)}
.et:active{transform:scale(.97)}
.et b{font-size:16px}.et small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.et.kd{--c:var(--dd)}.et.kp{--c:var(--dp)}.et.kc{--c:var(--dc)}
.eic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--soft);color:var(--c);transition:all .3s}
.et.on{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:var(--c)}
.et.on .eic{background:var(--c);color:#06121a}
.et.on .eic svg{animation:pop .45s}
.ech{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#06121a;transition:all .25s}
.et.on .ech{background:var(--c);border-color:var(--c);transform:scale(1.1)}
.et.off{opacity:.55}
.ec{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:15px;color:var(--ink);transition:transform .12s,background .2s}
.ec:active{transform:scale(.9)}.ec:disabled{opacity:.3}
.ec.sel{background:color-mix(in srgb,var(--st) 22%,var(--surface))}
.ec.today{outline:2.5px solid var(--st);outline-offset:-2px}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.dots .dd{background:var(--dd)}.dots .dp{background:var(--dp)}.dots .dc{background:var(--dc)}
.leg{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted);margin-top:10px}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}
.bk{display:block;width:100%;text-align:start;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-top:10px;animation:stIn .5s both;animation-delay:calc(var(--i)*60ms);transition:transform .15s}
.bk:active{transform:scale(.98)}
.bk b{font-size:16px}.bk small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.bk p{margin:8px 0 0;opacity:.8;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.bk .abb i{background:var(--st)}
.cd[data-act]{cursor:pointer}
@media (prefers-reduced-motion:reduce){.et,.bk{animation:none!important}}

/* quran option + habit colors */
.pb{padding:8px 10px}
.pb.onq{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--soft))}
.qn{text-align:center;font-weight:700;color:var(--good);font-size:13px}
.cc{position:relative}
.qd{position:absolute;top:5px;inset-inline-end:5px;width:6px;height:6px;border-radius:50%;background:var(--good);display:block}
:root{--hcol:#4FC48B;--hink:#0B0D10;--hbadc:#F2726C}
.hc-row{margin:12px 0}.hc-row>b{display:block;margin-bottom:8px;font-size:14px}
.swrow{display:flex;flex-wrap:wrap;gap:10px;width:100%;height:auto;border:0;border-radius:0}
.swb{width:36px;height:36px;border-radius:50%;border:2px solid transparent;position:relative;display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:20px;flex:none}
.swb.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.swb.cust{background:conic-gradient(#F2726C,#F5B544,#4FC48B,#5B9CF5,#A98BF2,#F2726C);cursor:pointer;overflow:hidden}
.swb.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0;cursor:pointer}

/* study: wake card + slot times */
.wake{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:linear-gradient(135deg,color-mix(in srgb,var(--st) 18%,var(--surface)),var(--surface))}
.wake .wk-i{font-size:30px}.wake div{flex:1;display:flex;flex-direction:column;line-height:1.35}
.wake b{font-size:34px;font-weight:800;letter-spacing:1px;text-align:start}
.wake small{color:var(--muted);font-size:12.5px}
.wake em{font-style:normal;font-size:12px;color:var(--st);font-weight:700}
.thb{color:inherit;font:inherit;font-weight:700;padding:0;white-space:nowrap}
.fl{display:block;margin:12px 0 6px;color:var(--muted);font-size:13px;font-weight:600}
.slr{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center;margin-top:8px}
.slr.slh small{text-align:center;color:var(--muted)}

/* lock screen */
.tb-btns{display:flex;gap:8px}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
body.locked #lock{display:flex}
body.locked #app,body.locked .topbar,body.locked .dock,body.locked #modal,body.locked #editor,body.locked #reader{visibility:hidden}
.lk-in{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;text-align:center}
.lk-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent);margin-bottom:12px}
.lk-in h2{font-size:24px;font-weight:800}
.lk-dots{display:flex;gap:14px;margin:20px 0 6px;direction:ltr}
.lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:all .15s}
.lk-dots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
.lk-dots.shake{animation:lkshake .4s}
@keyframes lkshake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lk-msg{min-height:22px;color:var(--bad);font-size:14px;font-weight:600}
.lk-len{width:200px;margin:8px 0 0}
.lk-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:18px;direction:ltr;justify-content:center}
.lk-pad button{height:72px;border-radius:50%;background:var(--soft);font-size:26px;font-weight:600;display:grid;place-items:center}
.lk-pad button:active:not(:disabled){background:color-mix(in srgb,var(--accent) 25%,var(--soft))}
.lk-pad .lk-bio{color:var(--accent)}
.lk-foot{margin-top:14px;min-height:34px}

/* library + reader */
.bkw{position:relative}
.bkf{color:var(--st)!important;font-weight:700}
.bke{position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--muted);font-size:15px}
#reader{display:none}
#reader.on{display:block;position:fixed;inset:0;z-index:50}
.toast{z-index:90!important}
.rd{position:absolute;inset:0;background:#15181d;display:flex;flex-direction:column;direction:ltr;color:var(--ink)}
.rd-top,.rd-bar,.rd-colors,.rd-selbar{direction:rtl}
.rd-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 8px;background:#0f1216;border-bottom:1px solid var(--line)}
.rd-top button{min-width:40px;height:40px;border-radius:12px;background:var(--soft);font-size:20px;font-weight:700}
.rd-pg{display:flex;align-items:center;gap:4px;direction:ltr}
.rd-pg input{width:56px;height:40px;text-align:center;border-radius:10px;padding:0 4px;font-weight:700;-moz-appearance:textfield}
.rd-pg input::-webkit-outer-spin-button,.rd-pg input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rd-pg span{color:var(--muted);font-size:13px;min-width:34px}
.rd-z{display:flex;gap:6px}
.rd-scroll{flex:1;overflow:auto;display:flex;padding:8px;position:relative;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.rd.zoomed .rd-scroll,.rd.t-select .rd-scroll{touch-action:pan-x pan-y}
.rd-page{position:relative;margin:auto;flex:none;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.5);--user-unit:1;--total-scale-factor:calc(var(--scale-factor,1) * var(--user-unit));direction:ltr}
.rd-c{position:absolute;inset:0;width:100%;height:100%;display:block}
.rd.night .rd-c{filter:invert(.9) hue-rotate(180deg)}
.rd-hl{position:absolute;inset:0;pointer-events:none}
.rd-hl i{position:absolute;display:block}
.rd-hl i.hl{opacity:.42;mix-blend-mode:multiply;border-radius:2px}
.rd.night .rd-hl i.hl{mix-blend-mode:normal;opacity:.38}
.rd-hl i.ul{border-bottom:2.5px solid;background:none!important}
.rd-ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rd:is(.t-pen,.t-marker,.t-erase,.t-note) .rd-ink{pointer-events:auto;touch-action:none;cursor:crosshair}
.rd-nts{position:absolute;inset:0;pointer-events:none}
.rd-n{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);width:30px;height:30px;border-radius:50% 50% 50% 4px;background:var(--c,#F5C84A);font-size:15px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.rd-n.sm{width:22px;height:22px;font-size:11px;transform:translate(-30%,-90%)}
.rd-bm{position:absolute;top:-4px;inset-inline-end:14px;font-size:26px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.rd-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted);line-height:1.8;direction:rtl}
.textLayer{position:absolute;inset:0;overflow:clip;line-height:1;text-size-adjust:none;-webkit-text-size-adjust:none;transform-origin:0 0;z-index:0;pointer-events:none;--min-font-size:1;--text-scale-factor:calc(var(--total-scale-factor) * var(--min-font-size));--min-font-size-inv:calc(1 / var(--min-font-size))}
.rd.t-select .textLayer{pointer-events:auto}
.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%;-webkit-user-select:text;user-select:text}
.textLayer>:not(.markedContent),.textLayer .markedContent span:not(.markedContent){z-index:1;--font-height:0;font-size:calc(var(--text-scale-factor) * var(--font-height));--scale-x:1;--rotate:0deg;transform:rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv))}
.textLayer .markedContent{display:contents}
.textLayer span[role=img]{-webkit-user-select:none;user-select:none;cursor:default}
.textLayer ::selection{background:rgba(70,130,255,.35)}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:0;cursor:default;-webkit-user-select:none;user-select:none}
.textLayer.selecting .endOfContent{inset:0}
.rd-selbar{position:absolute;left:8px;right:8px;top:calc(60px + env(safe-area-inset-top));z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:8px 10px;border-radius:16px;background:#232a35;box-shadow:0 8px 28px rgba(0,0,0,.55);border:1px solid var(--line)}
.rd-selbar[hidden]{display:none}
.rd-selbar>button:not(.rd-dot){padding:8px 12px;border-radius:10px;background:var(--soft);font-weight:700;font-size:13px}
.rd-dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent;flex:none}
.rd-dot.on{border-color:#fff;box-shadow:0 0 0 2px #0f1216 inset}
.rd-colors{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 10px;background:#0f1216;border-top:1px solid var(--line)}
.rd-undo{margin-inline-start:6px;padding:7px 12px;border-radius:10px;background:var(--soft);font-weight:700;font-size:13px}
.rd-bar{display:flex;background:#0f1216;padding:4px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rd-bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;color:var(--muted)}
.rd-bar button span{font-size:20px;line-height:1.1}.rd-bar button small{font-size:10.5px;font-weight:700}
.rd-bar button.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.rd-sheet{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;direction:rtl}
.rd-sheet[hidden]{display:none}
.rd-sh-in{width:100%;max-height:82%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));animation:sheetUp .28s both}
.rd-sh-in h4{font-size:17px;margin-bottom:10px}.rd-sh-in h5{margin:14px 0 6px;color:var(--muted);font-size:13px}
.rd-sh-in textarea{min-height:120px}
.rd-mh{display:flex;align-items:center;justify-content:space-between;gap:10px}.rd-mh h4{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-mh button{width:36px;height:36px;border-radius:10px;background:var(--soft)}
.rd-mg{display:grid;gap:8px;margin-top:12px}
.rd-mg button{padding:12px;border-radius:12px;background:var(--soft);font-weight:700;text-align:start}
.rd-row{display:flex;align-items:stretch;gap:6px;margin-top:6px}
.rd-row>button:first-child{flex:1;display:flex;align-items:center;gap:8px;text-align:start;padding:9px 10px;border-radius:12px;background:var(--bg);min-width:0}
.rd-row i{width:10px;height:28px;border-radius:5px;flex:none}
.rd-row small{color:var(--muted);flex:none}
.rd-row span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13.5px;white-space:pre-wrap}
.rd-rb{width:38px;border-radius:12px;background:var(--bg);flex:none}
body.rd-open{overflow:hidden}body.rd-open #app,body.rd-open .topbar,body.rd-open .dock{visibility:hidden}

/* ===== v6: pro tasks, week/month, eyes missing, study photos ===== */
.blk[data-type=check]{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 10px 5px 10px;margin:5px 0;gap:9px;align-items:center;transition:background-color .2s,border-color .2s,opacity .25s}
.blk[data-type=check]:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.blk[data-type=check] .bt{font-size:15px;line-height:1.55;min-height:1.55em}
.blk[data-type=check] .cbx{width:20px;height:20px;border-radius:50%;margin-top:0;border-width:1.6px}
.blk[data-type=check] .cbx svg{width:12px;height:12px}
.blk[data-type=check][data-done="1"]{opacity:.6;background:transparent}
.blk[data-type=check] .bt:empty::before{content:attr(data-ph);color:var(--muted);opacity:.5;font-size:14.5px}
.blk[data-type=check][data-prog]:not([data-prog=""])::after{margin-top:0;align-self:center}
.blk[data-type=check] .tgl{top:50%;margin-top:-14px}
.wsum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.wsum>div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 14px}
.wsum b{font-size:24px;font-weight:800;display:block;line-height:1.3}.wsum b small{font-size:13px;color:var(--muted);font-weight:600}
.wsum span{color:var(--muted);font-size:12.5px}
.wsum .wbar{grid-column:1/-1;padding:0;height:6px;border:0;border-radius:6px;background:var(--soft);overflow:hidden}
.wbar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.wd{padding:0;overflow:hidden;border-radius:18px;margin:10px 0;transition:transform .15s,border-color .2s}
.wd:active{transform:scale(.985)}
.wd.today{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.wd.fut{opacity:.75}
.wd-h{display:flex;align-items:center;gap:12px;padding:12px 14px 8px}
.wd-n{display:flex;flex-direction:column;align-items:center;min-width:48px;line-height:1.1}
.wd-n b{font-size:24px;font-weight:800;display:block;margin:0}
.wd-n small{font-size:11.5px;color:var(--muted)}
.wd.today .wd-n b{color:var(--accent)}
.wd-t{flex:1;font-weight:700;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wd-c{font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.wd-c.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.wd-pb{height:3px;background:var(--soft);margin:0 14px}.wd-pb i{display:block;height:100%;background:var(--accent);border-radius:3px}
.wd-b{padding:8px 14px 12px}
.wd-e{padding:4px 14px 14px;color:var(--muted);font-size:13px;opacity:.6}
.wl{display:flex;align-items:flex-start;gap:9px;padding:3px 0;font-size:14px;line-height:1.5;color:var(--ink);white-space:normal;overflow:visible;text-overflow:clip}
.wl span{flex:1;min-width:0;word-break:break-word}
.wl.dn{text-decoration:none;opacity:.55}.wl.dn span{text-decoration:line-through}
.wl.hd span{font-weight:800}
.wl.more{color:var(--muted);font-size:12.5px;padding-inline-start:27px}
.wl .wk{width:17px;height:17px;border-radius:50%;border:1.6px solid #4A5468;flex:none;margin-top:3px;display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:800;color:var(--accent-ink)}
.wl.dn .wk{background:var(--accent);border-color:var(--accent)}
.wl .bl{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;margin:9px 6px 0}
.cc.mc{position:relative}
.cc.mc.has{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.cc.mc.all{background:color-mix(in srgb,var(--good) 24%,var(--surface));border-color:var(--good)}
.mleg{text-align:center;margin-top:12px}
.mdot{display:inline-block;width:10px;height:10px;border-radius:4px;background:color-mix(in srgb,var(--accent) 40%,var(--surface));vertical-align:middle}
.mdot.full{background:color-mix(in srgb,var(--good) 60%,var(--surface))}
.ec.none{background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.ec.none>span{color:var(--muted)}
.nx{font-style:normal;font-size:11px;font-weight:800;color:var(--bad);line-height:6px;height:6px;display:inline-block}
.dots{align-items:center}
.sjg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sjc{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 8px 12px;animation:stIn .5s both;animation-delay:calc(var(--i)*50ms);transition:transform .15s}
.sjc:active{transform:scale(.97)}
.sjc b{display:block;margin:8px 4px 0;font-size:15px}.sjc small{display:block;margin:0 4px;color:var(--muted);font-size:12px}
.sjt{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:30px}
.sjt img,.sjp img{width:100%;height:100%;object-fit:cover;display:block}
.sjadd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.sjp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sjp button{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft)}
.sjp button i{position:absolute;bottom:3px;inset-inline-end:4px;font-style:normal;font-size:12px}
#pview{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.pv-top{display:flex;justify-content:space-between;align-items:center;padding:max(8px,env(safe-area-inset-top)) 10px 8px;color:#fff}
.pv-top button{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);font-size:18px}
.pv-img{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
.pv-img img{max-width:100%;max-height:100%;object-fit:contain}
.pv-n{position:absolute;top:50%;margin-top:-22px;width:40px;height:44px;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-size:26px;z-index:2}
.pv-n.l{left:8px}.pv-n.r{right:8px}.pv-n:disabled{opacity:.2}
.pv-cap{padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:#0f1216}
.pv-cap small{display:block;color:var(--muted);margin-bottom:6px}
body.locked #pview{visibility:hidden}
.pv-mv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.pv-mv button{padding:10px 0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:13px}
.pv-mv button:disabled{opacity:.3}
.sjp button.picked{outline:3px solid var(--accent);outline-offset:-3px}
.sjp button.picked img{opacity:.7}
.pk{position:absolute;top:5px;inset-inline-start:5px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);color:var(--accent-ink);font-size:14px;display:grid;place-items:center;font-weight:800}
.sjp button.picked .pk{background:var(--accent);border-color:var(--accent)}
.selbar{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:504px;margin:0 auto;z-index:8;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.5)}
.selbar button{padding:8px 12px;border-radius:10px;background:var(--soft);font-weight:700;font-size:13px}
.selbar .selmain{background:var(--accent);color:var(--accent-ink)}
.selbar .seldel{color:var(--bad)}
.selc{width:100%;text-align:center;font-weight:800;font-size:13px;color:var(--muted)}
</style>

  else{s=new Date(a.getFullYear(),0,1);e=new Date(a.getFullYear(),11,31)}

}

const PT_DEF={city:'بوحنيفية',lat:35.31,lon:0.05,fa:18,ia:17,off:[1,1,0,3,0],hadj:0};
function ptCfg(){const p=data.pt||{};return Object.assign({},PT_DEF,p,{off:(Array.isArray(p.off)&&p.off.length===5?p.off:PT_DEF.off)})}
function ptCalc(ds){
  const c=ptCfg(),[y,m,d]=ds.split('-').map(Number),R=Math.PI/180;
  const sn=x=>Math.sin(x*R),cs=x=>Math.cos(x*R),ac=x=>Math.acos(Math.max(-1,Math.min(1,x)))/R;
  const tz=-new Date(y,m-1,d,12).getTimezoneOffset()/60,lat=c.lat,lon=c.lon;
  const jd=Date.UTC(y,m-1,d)/864e5+2440587.5-lon/360,D=jd-2451545;
  const g=(357.529+0.98560028*D)%360,q=(280.459+0.98564736*D)%360;
  const L=q+1.915*sn(g)+0.02*sn(2*g),e=23.439-3.6e-7*D;
  let RA=Math.atan2(cs(e)*sn(L),cs(L))/R/15;RA=((RA%24)+24)%24;
  let eqt=q/15-RA;eqt=((eqt+12)%24+24)%24-12;
  const dec=Math.asin(sn(e)*sn(L))/R,mid=12+tz-lon/15-eqt;
  const A=a=>ac((-sn(a)-sn(lat)*sn(dec))/(cs(lat)*cs(dec)))/15;
  const asrA=-Math.atan(1/(1+Math.tan(Math.abs(lat-dec)*R)))/R;
  const H=[mid-A(c.fa),mid,mid+A(asrA),mid+A(.833),mid+A(c.ia)];
  const T=H.map((h,i)=>Math.round(h*60)+(+c.off[i]||0));
  return T.some(x=>!isFinite(x))?null:T;
}
const ptF=m=>{m=((m%1440)+1440)%1440;return Math.floor(m/60)+':'+pad(m%60)};
function ptState(){
  const t=today(),T=ptCalc(t);if(!T)return null;
  const now=new Date(),nm=now.getHours()*60+now.getMinutes()+now.getSeconds()/60,[y,m,d]=t.split('-').map(Number);
  let nx=T.findIndex(x=>x>nm),cur,ts;
  if(nx<0){const T2=ptCalc(fmt(addDays(parse(t),1)));if(!T2)return null;nx=0;cur=4;ts=new Date(y,m-1,d+1).getTime()+T2[0]*60000}
  else{cur=nx===0?4:nx-1;ts=new Date(y,m-1,d).getTime()+T[nx]*60000}
  return{cur,nx,ts};
}

function streaks(){
  let cur=0,d=new Date();
  if(!data.habit[fmt(d)])d=addDays(d,-1);
  while(data.habit[fmt(d)]==='c'){cur++;d=addDays(d,-1)}
  const keys=Object.keys(data.habit).sort();let best=0,run=0,prev=null;
  for(const k of keys){
    if(data.habit[k]==='c'){run=(prev&&fmt(addDays(parse(prev),1))===k)?run+1:1;prev=k;best=Math.max(best,run)}
    else{run=0;prev=null}
  }
  const rel=keys.filter(k=>data.habit[k]==='r').pop();
  const since=rel?Math.max(0,Math.round((parse(today())-parse(rel))/864e5)):null;
  return{cur,best,since};
}

function parseSlot(str){
  const m=String(str||'').match(/(\d{1,2})\s*[:.hH]\s*(\d{2})\s*[-–—]\s*(\d{1,2})\s*[:.hH]\s*(\d{2})/);

  if(h1>23||h2>23||m1>59||m2>59)return{a:'',b:''};
  return{a:pad(h1)+':'+pad(m1),b:pad(h2)+':'+pad(m2)};
}

async function imgScale(file,max,q){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);if(bmp.close)bmp.close();
  return new Promise(r=>c.toBlob(r,'image/jpeg',q));
}

/* ---------- app lock: PIN + fingerprint / Face ID ---------- */
const LK='hayati-lock';
const lk={cfg:null,mode:null,buf:'',tmp:'',len:4,busy:false,hiddenAt:0,bioOk:false,msg:'',t:null};
function lkLoad(){try{lk.cfg=JSON.parse(localStorage.getItem(LK)||'null')}catch(e){lk.cfg=null}}
function lkSave(){try{localStorage.setItem(LK,JSON.stringify(lk.cfg))}catch(e){}}
const lkActive=()=>!!(lk.cfg&&lk.cfg.hash);
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function lkHash(pin,salt){
  try{if(window.crypto&&crypto.subtle){
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
    return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:120000,hash:'SHA-256'},k,256));
  }}catch(e){}
  let h=2166136261;const t=salt+':'+pin;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return'f'+(h>>>0).toString(36);
}
const lkLen=()=>lk.mode==='setup1'||lk.mode==='setup2'?lk.len:((lk.cfg&&lk.cfg.len)||4);
const lkWait=()=>Math.max(0,Math.ceil(((lk.cfg&&lk.cfg.until)||0)-Date.now())/1000);
function lkShow(mode,msg){
  lk.mode=mode;lk.buf='';lk.msg=msg||'';lk.busy=false;
  if(mode==='unlock'){try{sessionStorage.removeItem('hayati-unlocked')}catch(e){}}
  if(mode==='setup1'){lk.tmp='';lk.len=(lk.cfg&&lk.cfg.len)||4}
  document.body.classList.add('locked');lkRender();
  if(mode==='unlock'&&lk.cfg&&lk.cfg.bio)setTimeout(()=>{if(lk.mode==='unlock')lkBioUnlock(true)},350);
}
function lkHide(){clearTimeout(lk.t);lk.mode=null;lk.buf='';document.body.classList.remove('locked');$('#lock').innerHTML='';try{if(lkActive())sessionStorage.setItem('hayati-unlocked','1')}catch(e){}}
function lkRender(){
  const m=lk.mode;if(!m)return;
  const len=lkLen(),wait=m==='unlock'?lkWait():0;
  const T={unlock:['My Life','أدخل الرمز للدخول'],setup1:['قفل التطبيق','اختر رمزاً سرياً'],setup2:['تأكيد الرمز','أعد إدخال الرمز نفسه']}[m];
  const msg=wait>0?`حاول مرة أخرى بعد ${Math.ceil(wait)} ثانية`:lk.msg;
  const dots=Array.from({length:len},(_,i)=>`<i class="${i<lk.buf.length?'on':''}"></i>`).join('');
  const keys=['1','2','3','4','5','6','7','8','9'].map(k=>`<button data-k="${k}" ${wait>0?'disabled':''}>${k}</button>`).join('');
  const bio=m==='unlock'&&lk.cfg&&lk.cfg.bio?`<button data-k="bio" class="lk-bio" aria-label="بصمة / وجه">${hsvg('<path d="M12 11a3 3 0 0 0-3 3c0 2.2-.6 4-1.6 5.6"/><path d="M12 7a7 7 0 0 0-7 7c0 1.4-.2 2.7-.6 3.8"/><path d="M12 3a11 11 0 0 1 11 11c0 1.3-.1 2.5-.4 3.6" /><path d="M15 14c0 3-.7 5.2-1.8 7"/><path d="M9 3.6A11 11 0 0 0 1 14"/>',30,1.7)}</button>`:'<span></span>';
  $('#lock').innerHTML=`<div class="lk-in"><div class="lk-ic">${hsvg('<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',30,1.8)}</div><h2>${T[0]}</h2><p class="muted">${T[1]}</p>
<div class="lk-dots" id="lkd">${dots}</div><div class="lk-msg" id="lkm">${esc(msg)}</div>
${m==='setup1'?`<div class="seg lk-len"><button data-k="len4" class="${lk.len===4?'on':''}">4 أرقام</button><button data-k="len6" class="${lk.len===6?'on':''}">6 أرقام</button></div>`:''}
<div class="lk-pad">${keys}${bio}<button data-k="0" ${wait>0?'disabled':''}>0</button><button data-k="b" aria-label="حذف">⌫</button></div>
<div class="lk-foot">${m==='unlock'?'<button class="link" data-k="forgot">نسيت الرمز؟</button>':m==='setup1'?`<button class="link" data-k="cancel">${lkActive()?'إلغاء':'لاحقاً'}</button>`:'<button class="link" data-k="back">رجوع</button>'}</div></div>`;
  clearTimeout(lk.t);if(wait>0)lk.t=setTimeout(lkRender,1000);
}
async function lkKey(k){
  if(lk.busy)return;
  if(k==='bio')return lkBioUnlock(false);
  if(k==='forgot')return lkForgot();
  if(k==='cancel'){if(!lkActive()&&!(lk.cfg&&lk.cfg.skipped)){lk.cfg=Object.assign(lk.cfg||{},{skipped:true});lkSave()}return lkHide()}
  if(k==='back'){lk.tmp='';return lkShow('setup1')}
  if(k==='len4'||k==='len6'){lk.len=k==='len4'?4:6;lk.buf='';return lkRender()}
  if(k==='b'){lk.buf=lk.buf.slice(0,-1);lk.msg='';return lkRender()}
  if(!/^\d$/.test(k)||(lk.mode==='unlock'&&lkWait()>0))return;
  const len=lkLen();if(lk.buf.length>=len)return;
  lk.buf+=k;lk.msg='';lkRender();
  try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
  if(lk.buf.length<len)return;
  lk.busy=true;
  try{await lkSubmit()}finally{lk.busy=false}
}
function lkBad(msg){lk.buf='';lk.msg=msg;lkRender();const d=$('#lkd');if(d){d.classList.add('shake')}try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(e){}}
async function lkSubmit(){
  const m=lk.mode,pin=lk.buf;
  if(m==='setup1'){lk.tmp=pin;lk.buf='';lk.mode='setup2';return lkRender()}
  if(m==='setup2'){
    if(pin!==lk.tmp){lk.tmp='';lk.mode='setup1';return lkBad('الرمزان غير متطابقين، ابدأ من جديد')}
    const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
    const old=lk.cfg||{};
    lk.cfg={salt,hash:await lkHash(pin,salt),len:lk.len,bio:old.bio||null,delay:old.delay===undefined?30:old.delay,fails:0,until:0};
    lkSave();lkHide();hToast('🔒 تم تفعيل القفل');return;
  }
  if(m==='unlock'){
    const c=lk.cfg;
    if(await lkHash(pin,c.salt)===c.hash){c.fails=0;c.until=0;lkSave();lkHide();return}
    c.fails=(c.fails||0)+1;
    if(c.fails>=5){c.until=Date.now()+Math.min(600,30*Math.pow(2,c.fails-5))*1000}
    lkSave();lkBad(c.fails>=5?'':`رمز خاطئ (${c.fails}/5)`);
  }
}
async function lkBioSupported(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function lkBioUnlock(auto){
  if(!lk.cfg||!lk.cfg.bio||lk.busy)return;
  lk.busy=true;
  try{
    await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(lk.cfg.bio),transports:['internal']}],userVerification:'required',timeout:60000}});
    lk.cfg.fails=0;lk.cfg.until=0;lkSave();lkHide();
  }catch(e){if(!auto){lk.msg='تعذّر التحقق بالبصمة، استخدم الرمز';lkRender()}}
  finally{lk.busy=false}
}
async function lkBioToggle(){
  const c=lk.cfg;if(!c||!c.hash)return;
  if(c.bio){c.bio=null;lkSave();return render()}
  try{
    const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'My Life'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'my-life',displayName:'My Life'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});

}

<label class="fl">يُقفل التطبيق</label><select id="lkd"><option value="0" ${c.delay===0?'selected':''}>فوراً عند الخروج منه</option><option value="30" ${c.delay===30?'selected':''}>بعد 30 ثانية من الخروج</option><option value="300" ${c.delay===300?'selected':''}>بعد 5 دقائق من الخروج</option><option value="-1" ${c.delay===-1?'selected':''}>عند فتحه من جديد فقط</option></select>

  RD.ne=o;let txt='';
  if(!o.isNew){const f=rdFind(o.id);if(!f)return;o.page=f.page;txt=o.hl?(f.it.nt||''):(f.it.tx||'')}
  rdSheet(`<h4>${o.hl?'ملاحظة على التظليل':'ملاحظة'}</h4><textarea id="rdnt" dir="auto" placeholder="اكتب ملاحظتك…">${esc(txt)}</textarea><div class="acts"><button class="btn" data-r="notesave">حفظ</button>${o.isNew?'':'<button class="btn ghost" data-r="notedel">حذف</button>'}<button class="btn ghost" data-r="sheetx">إغلاق</button></div>`);
  setTimeout(()=>{const t=$('#rdnt');if(t)t.focus()},50);
}
function rdMenu(){
  const b=RD.b,bm=(b.bm||[]).includes(RD.n),rows=[];
  for(const k of Object.keys(b.ann||{}).map(Number).sort((a,c)=>a-c)){
    for(const it of b.ann[k]){
      if(it.t==='p'||it.t==='m')continue;
      const txt=it.t==='n'?it.tx:(it.tx||'')+(it.nt?'\n💬 '+it.nt:'');
      rows.push(`<div class="rd-row"><button data-r="goto" data-p="${k}"><i style="background:${it.c}"></i><small>ص ${k}</small><span>${it.t==='n'?'📝 ':it.t==='u'?'تسطير: ':''}${esc(txt).slice(0,140)||'…'}</span></button>${it.t==='n'?'':`<button class="rd-rb" data-r="hnote" data-id="${it.id}" aria-label="ملاحظة">💬</button>`}<button class="rd-rb" data-r="del" data-p="${k}" data-id="${it.id}" aria-label="حذف">✕</button></div>`);
    }
  }
  for(const k of (b.bm||[]).slice().sort((a,c)=>a-c))rows.unshift(`<div class="rd-row"><button data-r="goto" data-p="${k}"><i style="background:var(--accent)"></i><small>ص ${k}</small><span>🔖 علامة صفحة</span></button><button class="rd-rb" data-r="bmdel" data-p="${k}" aria-label="حذف">✕</button></div>`);
  rdSheet(`<div class="rd-mh"><h4>${esc(b.title)}</h4><button data-r="sheetx" aria-label="إغلاق">✕</button></div>
<div class="rd-mg"><button data-r="bm">${bm?'🔖 إزالة العلامة':'🔖 علامة لهذه الصفحة'}</button><button data-r="night">${RD.night?'☀️ وضع عادي':'🌙 الوضع الليلي'}</button><button data-r="dir">↔ التقليب: ${b.rtl?'عربي (يمين←يسار)':'لاتيني (يسار←يمين)'}</button></div>
<h5>العلامات والملاحظات (${rows.length})</h5>${rows.join('')||''}`);
}
function rdAct(a,D){
  switch(a){
    case 'close':rdClose();break;
    case 'prev':rdGo(RD.n-1);break;
    case 'next':rdGo(RD.n+1);break;
    case 'zin':rdZoomTo(RD.z*1.3);break;
    case 'zout':rdZoomTo(RD.z/1.3);break;
    case 'tool':RD.tool=D.v;RD.sel=null;$('#rdsb').hidden=true;try{getSelection().removeAllRanges()}catch(e){}rdUi();break;
    case 'color':RD.color=D.c;rdUi();break;
    case 'undo':{const arr=rdAnn(RD.n);if(arr.length){rdDel(RD.n,arr[arr.length-1].id);rdDrawAnn();hVib(8)}break}
    case 'menu':rdMenu();break;
    case 'sheetx':rdSheet('');break;
    case 'bm':{const b=RD.b;b.bm=b.bm||[];const i=b.bm.indexOf(RD.n);if(i>=0)b.bm.splice(i,1);else b.bm.push(RD.n);save();rdUi();rdMenu();break}
    case 'bmdel':{const b=RD.b;b.bm=(b.bm||[]).filter(x=>x!==+D.p);save();rdUi();rdMenu();break}
    case 'night':RD.night=!RD.night;data.eyes.rnight=RD.night;save();rdUi();rdMenu();break;
    case 'dir':RD.b.rtl=!RD.b.rtl;save();rdMenu();break;
    case 'goto':rdSheet('');rdGo(+D.p);break;
    case 'del':rdDel(+D.p,D.id);if(+D.p===RD.n)rdDrawAnn();rdMenu();break;
    case 'note':rdNoteOpen({id:D.id});break;
    case 'hnote':rdNoteOpen({id:D.id,hl:true});break;
    case 'notesave':{
      const v=($('#rdnt').value||'').trim(),o=RD.ne;if(!o)break;
      if(o.isNew){if(v)rdAdd(RD.n,{id:uid(),t:'n',c:RD.color,x:+o.x.toFixed(4),y:+o.y.toFixed(4),tx:v})}
      else{const f=rdFind(o.id);if(f){if(o.hl){if(v)f.it.nt=v;else delete f.it.nt}else{if(v)f.it.tx=v;else rdDel(f.page,o.id)}save()}}
      RD.ne=null;rdSheet('');rdDrawAnn();break}
    case 'notedel':{const o=RD.ne;if(o&&!o.isNew){const f=rdFind(o.id);if(f){if(o.hl){delete f.it.nt;save()}else rdDel(f.page,o.id)}}RD.ne=null;rdSheet('');rdDrawAnn();break}
    case 'selhl':rdMakeHL('h',D.c);break;
    case 'selul':rdMakeHL('u',RD.color);break;
    case 'selnote':{const it=rdMakeHL('h',RD.color);if(it)rdNoteOpen({id:it.id,hl:true});break}
    case 'selcopy':{if(RD.sel){try{navigator.clipboard.writeText(RD.sel.tx);hToast('تم النسخ')}catch(e){}}break}
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest&&e.target.closest('#reader [data-r]');if(!t)return;
  RD.barDown=false;rdAct(t.dataset.r,t.dataset);
});
['pointerdown','mousedown','touchstart'].forEach(n=>document.addEventListener(n,e=>{
  const sb=e.target.closest&&e.target.closest('#rdsb');if(!sb)return;
  RD.barDown=true;if(n!=='touchstart'||e.cancelable)e.preventDefault();
},{passive:false}));
document.addEventListener('change',e=>{if(e.target.id==='rdn'&&RD.open)rdGo(+e.target.value)});
document.addEventListener('keydown',e=>{
  if(!RD.open||lk.mode||(e.target.tagName==='TEXTAREA')||(e.target.id==='rdn'))return;
  if(e.key==='ArrowRight')rdGo(RD.n+(RD.b.rtl?-1:1));else if(e.key==='ArrowLeft')rdGo(RD.n-(RD.b.rtl?-1:1));
  else if(e.key==='Escape'){if(!$('#rdsh').hidden)rdSheet('');else rdClose()}
});
buildNav();
load().then(render).then(lkBoot);

/* ---------- keyboard: hide dock only while the keyboard is really open ---------- */
(function(){
  const vv=window.visualViewport;let base=0,open=false;
  const editable=el=>el&&(el.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  const set=v=>{open=v;document.body.classList.toggle('kb',v)};
  if(!vv){
    document.addEventListener('focusin',e=>{if(editable(e.target))set(true)});
    document.addEventListener('focusout',()=>setTimeout(()=>{if(!editable(document.activeElement))set(false)},50));
    return;
  }
  const check=()=>{
    const h=vv.height;
    if(!open)base=Math.max(base,h);
    const shrunk=Math.max(base,innerHeight)-h>140;
    if(shrunk&&editable(document.activeElement)){if(!open)set(true)}
    else if(open){set(false);const a=document.activeElement;if(editable(a)&&!a.closest('#lock'))a.blur()}
  };
  vv.addEventListener('resize',check);
  window.addEventListener('orientationchange',()=>{base=0;setTimeout(()=>{base=vv.height;check()},400)});
  document.addEventListener('focusout',()=>setTimeout(()=>{if(open&&!editable(document.activeElement))set(false)},80));
  base=vv.height;
})();
</script>
